[package]
name = "deltalake-catalog-glue"
version = "2.0.0"
authors.workspace = true
keywords.workspace = true
readme.workspace = true
edition.workspace = true
homepage.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = { workspace = true }
aws-config = { version = "1.8", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "credentials-process",
    "client-hyper",
] }
aws-sdk-glue = { version = "1.120", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    # Use the new default HTTPS client stack (no hyper 0.14).
    "default-https-client",
] }
aws-sdk-sts = { version = "1.101.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
deltalake-core = { version = "2.0", path = "../core", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = { workspace = true }
url.workspace = true

[features]
default = ["rustls"]
native-tls = ["deltalake-core/native-tls"]
rustls = ["deltalake-core/rustls"]

[dev-dependencies]
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
deltalake-aws = { path = "../aws", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
